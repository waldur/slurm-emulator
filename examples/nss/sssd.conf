# Reference sssd configuration for the emulator's NSS identity mode
# (SLURM_EMULATOR_NSS=1): user names are resolved through libc → sssd →
# an RFC 2307 LDAP directory, so `id`, sacct and the slurmrestd job views
# carry the uid/gid the directory assigns.
#
# Mount at /etc/slurm-emulator/sssd.conf (any mode: the entrypoint installs a
# private root:root 0600 copy, which is what sssd insists on, before starting
# it; /etc/sssd/sssd.conf and SLURM_EMULATOR_SSSD_CONF also work). Adjust
# ldap_uri / ldap_search_base / the bind DN for your directory — the values
# below match the OpenLDAP service in
# examples/firecrest/ui/docker-compose.nss.yml and the seed in seed.ldif.

[sssd]
config_file_version = 2
services = nss
domains = emulator

[nss]
filter_users = root
filter_groups = root

[domain/emulator]
id_provider = ldap
auth_provider = none
ldap_schema = rfc2307
ldap_uri = ldap://openldap
ldap_search_base = dc=example,dc=org
ldap_user_search_base = ou=people,dc=example,dc=org
ldap_group_search_base = ou=groups,dc=example,dc=org
# Read-only bind; anonymous works too when the directory allows it.
ldap_default_bind_dn = cn=readonly,dc=example,dc=org
ldap_default_authtok = readonly
ldap_tls_reqcert = never
# Lookups by name only: no directory-wide enumeration, and names stay
# short (hpc_9001, not hpc_9001@emulator) so they match Slurm user names.
enumerate = false
use_fully_qualified_names = false
cache_credentials = false
# Short cache so a user provisioned by the site agent shows up promptly.
entry_cache_timeout = 30
