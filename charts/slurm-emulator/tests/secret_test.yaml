suite: credentials Secret
templates:
  - templates/secret.yaml
tests:
  - it: renders the chart-managed Secret by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData.ui-username
          value: admin
      - equal:
          path: stringData.jwt-key
          value: ""

  - it: carries the configured credentials
    set:
      auth.uiUsername: ops
      auth.uiPassword: s3cret
      auth.jwtKey: signing-key
    asserts:
      - equal:
          path: stringData.ui-password
          value: s3cret
      - equal:
          path: stringData.jwt-key
          value: signing-key

  - it: renders nothing when auth.existingSecret is set
    set:
      auth.existingSecret: my-secret
    asserts:
      - hasDocuments:
          count: 0
