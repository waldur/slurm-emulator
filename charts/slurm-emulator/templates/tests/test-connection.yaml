apiVersion: v1
kind: Pod
metadata:
  name: {{ include "slurm-emulator.fullname" . }}-test-connection
  labels:
    {{- include "slurm-emulator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - |
          set -eu
          host="{{ include "slurm-emulator.fullname" . }}"

          echo "GET http://${host}:8080/ (control API)"
          curl -fsS --max-time 5 "http://${host}:8080/" \
            | grep -q '"SLURM Emulator API"' \
            || { echo "FAIL: control API did not identify itself"; exit 1; }

          # Unauthenticated on purpose: the real slurmrestd serves its own spec
          # without a token, so this probe holds whether or not auth.jwtKey is set.
          echo "GET http://${host}:6820/openapi.json (slurmrestd)"
          curl -fsS --max-time 10 "http://${host}:6820/openapi.json" \
            | grep -q '"Slurm REST API"' \
            || { echo "FAIL: slurmrestd did not serve its OpenAPI spec"; exit 1; }

          echo "Both API planes responding."
