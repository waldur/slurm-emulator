{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slurm-emulator.fullname" . }}
  labels:
    {{- include "slurm-emulator.labels" . | nindent 4 }}
type: Opaque
stringData:
  ui-username: {{ .Values.auth.uiUsername | quote }}
  ui-password: {{ .Values.auth.uiPassword | quote }}
  # An empty key leaves slurmrestd accepting any token — the emulator treats
  # SLURM_EMULATOR_JWT_KEY="" the same as unset.
  jwt-key: {{ .Values.auth.jwtKey | quote }}
{{- end }}
