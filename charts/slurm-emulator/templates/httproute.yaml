{{- if .Values.gatewayApi.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "slurm-emulator.fullname" . }}
  labels:
    {{- include "slurm-emulator.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- if .Values.gatewayApi.createGateway }}
    - name: {{ include "slurm-emulator.fullname" . }}
      sectionName: {{ .Values.gatewayApi.gateway.listenerName | quote }}
    {{- else }}
    {{- /* `required` does not reject an empty list, and an empty parentRefs renders
           `parentRefs:` (null) — which the API server accepts, leaving the HTTPRoute
           bound to no Gateway with nothing anywhere reporting it. */}}
    {{- if not .Values.gatewayApi.parentRefs }}
    {{- fail "gatewayApi.parentRefs is required unless gatewayApi.createGateway is true" }}
    {{- end }}
    {{- toYaml .Values.gatewayApi.parentRefs | nindent 4 }}
    {{- end }}
  {{- with .Values.gatewayApi.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.gatewayApi.rules }}
    {{- range .Values.gatewayApi.rules }}
    - matches:
        {{- toYaml .matches | nindent 8 }}
      backendRefs:
        - name: {{ include "slurm-emulator.fullname" $ }}
          port: {{ .port }}
    {{- end }}
    {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "slurm-emulator.fullname" . }}
          port: 8080
    {{- end }}
{{- end }}
