ClusterName=demo
SlurmctldHost=localhost
SlurmUser=root
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd/%n
SlurmdPidFile=/var/run/slurmd-%n.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd-%n.log
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
AccountingStorageEnforce=associations,limits,qos
AccountingStorageTRES=gres/gpu
GresTypes=gpu
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
SlurmdParameters=config_overrides
MpiDefault=none
ReturnToService=2
DefMemPerCPU=8192
KillWait=2
NodeName=node001 NodeHostname=localhost Port=17001 CPUs=64 RealMemory=524288 Gres=gpu:4
NodeName=node002 NodeHostname=localhost Port=17002 CPUs=64 RealMemory=524288 Gres=gpu:4
NodeName=node003 NodeHostname=localhost Port=17003 CPUs=64 RealMemory=524288 Gres=gpu:4
NodeName=node004 NodeHostname=localhost Port=17004 CPUs=64 RealMemory=524288 Gres=gpu:4
PartitionName=debug Nodes=node[001-002] Default=YES State=UP
PartitionName=gpu Nodes=node[003-004] State=UP
