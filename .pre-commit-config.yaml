repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
        # Helm templates are Go templates, not YAML — a leading {{- if }} is a
        # parse error here. `helm lint` + `helm unittest` cover them in CI.
        exclude: ^charts/[^/]+/templates/
      - id: trailing-whitespace
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: check-slurm-refs
        # Validates slurm://path#symbol references against the cached Slurm
        # source (docs/slurm-parity.md). Without a cache it still rejects
        # legacy file.c:123 refs and bad grammar; CI runs it with --strict.
        name: check slurm:// source references
        entry: uv run scripts/check_slurm_refs.py
        language: system
        pass_filenames: true
        files: ^(emulator|tests|scripts|docs)/.*\.(py|md)$|^(README|CLAUDE|AGENTS|CHANGELOG)\.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.2
    hooks:
      - id: ruff
        exclude: ^.*tests/
        args: [ --fix ]
      - id: ruff-format

